# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    damuzhi_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

damuzhi_controller:
  ros__parameters:
    joints:
      - thumb_cmc_yaw
      - thumb_cmc_roll
      - thumb_cmc_pitch
      - thumb_mcp
      - thumb_dip
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity